name: VegasCon Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --onefile vegascon.py

      - name: Package into ZIP
        run: |
          mkdir package
          copy dist\vegascon.exe package\
          copy msvpvf.exe package\
          xcopy Res package\Res /E /I
          powershell Compress-Archive -Path package\* -DestinationPath vegascon_package.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: vegascon-package
          path: vegascon_package.zip
